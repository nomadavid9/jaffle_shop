version: 2

sources:
    - name: jaffle_shop
      description: This is a replica of the Postgres database used by our app
      database: raw
      schema: jaffle_shop
      tables:
          - name: customers
            description: One record per customer.
          - name: orders
            description: One record per order. Includes cancelled and deleted orders.

    - name: stripe
      description: This is a replica that of the data that comes from our stripe instance.
      database: raw
      schema: stripe
      tables:
          - name: payment
            description: One record per payment.